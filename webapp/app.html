<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мої справи">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#10142a">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/icon.png">
<title>Мої судові справи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* стриманий синій у кольорах сайту osadko.online: темно-синій фон, приглушений блакитний акцент, IBM Plex */
  --bg:#10142a; --grey:#171c36; --text:#dfe3ef; --muted:#a3aac2; --soft:#c5cbe0; --line:#272d4a;
  --head:#ffffff; --fill:#34437f; --fill-h:#40509a; --on-fill:#ffffff; --on-fill-muted:#c9d0ea; --rule:#363d60; --link:#a9b7ea; --acc:#93a4dc;
  --side:#0c1022; --side-on:#1b2140;
  --t-civ:#7fb2ff; --t-com:#5fd0b8; --t-crim:#f0a898; --t-adm:#e3c07a; --t-admj:#b8a4f0; --t-oth:#a3aac2;
  --crit:#f0a898; --crit-soft:#2a1a1e; --crit-line:#57303a; --warn:#e3c07a; --warn-soft:#2a2619; --ok:#7cc79a; --ok-soft:#14281f;
  --font-display:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:18px;
  color-scheme:dark;
  /* сумісність зі старими назвами */
  --surface:var(--bg); --surface2:var(--grey); --ink:var(--text); --accent:var(--head); --accent-ink:var(--on-fill); --accent-soft:var(--grey);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --grey:#f3f4f7; --text:#222736; --muted:#606779; --soft:#3d4458; --line:#e1e3ea;
  --head:#1b2a6b; --fill:#1b2a6b; --fill-h:#13205a; --on-fill:#ffffff; --on-fill-muted:#c9d0ea; --rule:#c5cad8; --link:#1b2a6b; --acc:#1b2a6b;
  --side:#f3f4f7; --side-on:#e3e6f0;
  --t-civ:#1f5fbf; --t-com:#0f7a68; --t-crim:#b3402f; --t-adm:#8a5a00; --t-admj:#5b3fb0; --t-oth:#606779;
  --crit:#a1221b; --crit-soft:#fbe9e7; --crit-line:#e9b9b4; --warn:#8a5a00; --warn-soft:#fbf0d6; --ok:#1e6a39; --ok-soft:#e3f2e7;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--grey);color:var(--text);font:400 16px/1.4 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--head)}
:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.app{max-width:640px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--pad) 28px;display:flex;flex-direction:column}

/* шапка екрана: синя смуга на всю ширину */
.top{margin:0 calc(-1*var(--pad));padding:calc(20px + env(safe-area-inset-top)) var(--pad) 18px;background:var(--fill);color:var(--on-fill);display:flex;flex-direction:column;gap:6px}
.back{margin:0 calc(-1*var(--pad));padding:calc(14px + env(safe-area-inset-top)) var(--pad) 0;background:var(--fill);color:var(--on-fill-muted);font:500 14px/1 var(--font-display);text-transform:uppercase;letter-spacing:.06em}
.back + .top{padding-top:12px}
.top .eyebrow{color:var(--on-fill-muted)}
.eyebrow{margin:0;color:var(--muted);font-size:14px}
h1{font:600 32px/1 var(--font-display);text-transform:uppercase;letter-spacing:-.005em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.back + .top h1{font-size:24px;line-height:1.08}
h2{font:500 19px/1.1 var(--font-display);text-transform:uppercase;color:var(--head);margin:26px 0 0;padding-top:12px;border-top:5px solid var(--rule)}

.fresh{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);background:var(--grey);margin:0 calc(-1*var(--pad));padding:10px var(--pad)}
.fresh i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.fresh.bad i{background:var(--crit)}
.fresh span{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);margin:0 calc(-1*var(--pad));border-bottom:1px solid var(--line)}
.tile{padding:16px 10px 14px var(--pad);display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.tile:first-child{border-left:0}
.tile b{font:600 40px/1 var(--font-display);color:var(--head);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);line-height:1.2}
.tile.hot b{color:var(--crit)}
.alert{background:var(--crit-soft);color:var(--crit);padding:12px 14px;font-size:14.5px;border-left:5px solid var(--crit);margin-top:18px}
.alert b{display:block;font:500 16px/1.2 var(--font-display);text-transform:uppercase;margin-bottom:3px}

/* списки: суцільні рядки з лініями замість окремих карток */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:13px 0;width:100%;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.row small.hl{color:var(--head);font-weight:700}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.own{font:500 12px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--head)}
.row small.wr{color:var(--warn)}
button.row:active,.row button.main:active{background:var(--grey)}
.date{flex:none;width:54px;text-align:center;background:var(--fill);color:var(--on-fill);padding:7px 0 6px;font:400 11px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:.05em;align-self:flex-start}
.date b{display:block;font:600 24px/1 var(--font-display);letter-spacing:0}
.date u{display:block;text-decoration:none;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.3);font-size:13px;letter-spacing:0;font-variant-numeric:tabular-nums}
.num{font-family:var(--font-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.chip{flex:none;font:500 12px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.tag{background:var(--grey);color:var(--muted);vertical-align:2px;margin-left:4px}
.chk{flex:none;width:24px;height:24px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-fill)}
.chk.on{background:var(--fill);border-color:var(--fill)}
.chk.on::after{content:"";width:11px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-1px)}
.done b{text-decoration:line-through;color:var(--muted)}

.filters{display:flex;gap:0;overflow-x:auto;margin:14px calc(-1*var(--pad)) 0;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.filters button{flex:none;padding:10px 12px;font:500 14px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.filters button.on{color:var(--head);border-bottom-color:var(--rule)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--head);outline:0}
#q{margin-top:16px}
.btn{background:var(--fill);color:var(--on-fill);padding:14px 18px;font:500 15px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;text-align:center;text-decoration:none;display:inline-block;margin-top:14px}
.btn:active{background:var(--fill-h)}
.btn.ghost{background:none;color:var(--head);box-shadow:inset 0 0 0 1.5px var(--head)}
.btn.danger{background:none;color:var(--crit);box-shadow:inset 0 0 0 1.5px var(--crit)}
.btn.sm{padding:10px 12px;font-size:13px}
.btn[disabled]{opacity:.5}
.fresh .btn,.row .btn,.inline .btn,.card .btn{margin-top:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto}
.list > .btn{align-self:flex-start;margin:0 0 14px}
.meta{margin:8px 0 0;padding:0}
.meta div{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.meta dt{flex:none;width:92px;color:var(--muted);font:400 12.5px/1.6 var(--font-display);text-transform:uppercase;letter-spacing:.05em}
.meta dd{margin:0;overflow-wrap:anywhere}
.card{background:var(--grey);border-left:5px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:7px;margin-top:12px}
.card > b{font:500 18px/1.2 var(--font-display);text-transform:uppercase;color:var(--head)}
.card p{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.card .acts{margin-top:4px}
.text{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--text)!important}
.inline{display:flex;gap:0;margin-top:14px}
.inline .field{flex:1;min-width:0;border-right:0}
.cal{margin-top:16px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font:500 20px/1 var(--font-display);text-transform:uppercase;color:var(--head)}
.calhead button{width:40px;height:40px;box-shadow:inset 0 0 0 1.5px var(--head);color:var(--head);text-align:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;text-align:center;border-top:5px solid var(--rule)}
.grid > span{font:400 12px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 0 5px}
.grid button{aspect-ratio:1;text-align:center;font-variant-numeric:tabular-nums;position:relative;font-size:16px}
.grid button.today{box-shadow:inset 0 0 0 2px var(--head)}
.grid button.sel{background:var(--fill);color:var(--on-fill)}
.grid button i{position:absolute;bottom:6px;left:50%;width:6px;height:6px;background:var(--head);transform:translateX(-50%)}
.grid button i.d{background:var(--crit)}
.grid button i.both{box-shadow:9px 0 0 var(--crit);transform:translateX(-7px)}
.grid button.sel i{background:var(--on-fill)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;background:var(--head);margin-right:6px}
.legend i.d{background:var(--crit)}
.lnk{margin-left:auto;color:var(--head);font:500 13px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;text-decoration:underline;text-underline-offset:3px}
.lnk + .lnk{margin-left:0}
.day{margin:22px 0 0;padding:0 0 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:500 17px/1.1 var(--font-display);text-transform:uppercase;color:var(--head)}
.day span{font:400 13.5px/1 var(--font-body);text-transform:none;color:var(--muted)}
.day.now{border-bottom:3px solid var(--rule)}
.day b{font-weight:500}
.legend{align-items:center}
.empty{color:var(--muted);font-size:14.5px;padding:12px 0 0;margin:0}
.err{color:var(--crit);font-size:14.5px;margin:10px 0 0}

.tabs{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 9px;font:400 11px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:relative;border-top:3px solid transparent;margin-top:-1px}
.tabs button.on{color:var(--head);border-top-color:var(--rule);font-weight:500}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.tabs em{position:absolute;top:5px;left:calc(50% + 7px);background:var(--crit);color:#fff;font:500 11px/16px var(--font-display);font-style:normal;min-width:16px;height:16px;padding:0 4px;text-align:center}
.shade{position:absolute;inset:0;background:rgba(8,12,34,.6);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;border-top:6px solid var(--rule);padding:20px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.sheet h3{margin:0;font:500 24px/1.1 var(--font-display);text-transform:uppercase;color:var(--head)}
.sheet label{font:400 12.5px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sheet label .field{font-family:var(--font-body);text-transform:none;letter-spacing:0;color:var(--text)}
.sheet p{margin:0;font-size:13.5px;color:var(--muted)}
.sheet .btn{margin-top:2px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 22px}
.login h1{color:var(--head);font-size:40px;padding-top:16px;border-top:6px solid var(--rule)}
.login p{margin:0;color:var(--muted)}
.login .list{gap:0}
#toast{position:absolute;left:18px;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fill);color:var(--on-fill);font-size:14.5px;padding:12px 14px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;z-index:9}
#toast.show{opacity:1}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--head);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.spin{animation:none}}

/* таблиці (комп'ютер): один рядок на запис, без переносів, довге обрізається з підказкою */
.tw{overflow-x:auto;margin-top:4px}
.tb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14.5px}
.tb th{font:500 12.5px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:12px 12px 9px 0;border-bottom:2px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb th.s{cursor:pointer;color:var(--head)}
.tb th.up::after{content:" ↑"}
.tb th.dn::after{content:" ↓"}
.tb td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tb tbody tr[data-a]{cursor:pointer}
.tb tbody tr:hover{background:var(--grey)}
.tb td.num{font-family:var(--font-mono);font-size:13.5px}
.tb td.b{font-weight:700}
.tb td.m{color:var(--muted)}
.tb td.act{overflow:visible;text-overflow:clip}
.tb tr.done td{color:var(--muted)}
.tb tr.done td.b{text-decoration:line-through}
.tb .chip{display:inline-block}
.tb .btn{margin:0;padding:6px 9px;font-size:12px}
.x{color:var(--crit);font-size:15px;padding:4px 8px}
.wr{color:var(--warn)}
.navbar{flex:none;display:flex;gap:22px;align-items:center;margin:0 calc(-1*var(--pad));padding:16px var(--pad) 8px;font:500 13px/1.6 var(--font-display);text-transform:uppercase;letter-spacing:.05em}
.navbar button{color:var(--head);text-decoration:underline;text-underline-offset:4px}
.navbar button[disabled]{opacity:.35;text-decoration:none;cursor:default}
.navbar span{margin-left:auto;color:var(--muted);text-transform:none;letter-spacing:0;font:400 13px/1.6 var(--font-body)}
.navbar + .top{padding-top:4px}
.toolbar{display:flex;gap:14px;align-items:center;margin-top:16px}
.toolbar #q{margin-top:0;max-width:420px}
.toolbar .filters{margin:0;padding:0;border-bottom:0;flex:1}
.toolbar .btn{margin-top:0;white-space:nowrap}

/* вузький екран: блоки йдуть один за одним у порядку важливості */
.side{display:none}
.evs{display:none}
.cols,.cols2{display:flex;flex-direction:column}
.c-alerts,.k-a{order:1}.c-hear,.k-b{order:2}.c-dl,.k-c{order:3}
.row.cur{background:var(--grey);box-shadow:inset 4px 0 0 var(--rule);padding-left:14px;padding-right:10px}
.hint{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px}

/* комп'ютер: бічне меню, кілька колонок, вікна по центру */
@media (min-width:960px){
  :root{--pad:30px}
  .app{max-width:none;flex-direction:row}
  .tabs{display:none}
  .side{display:flex;flex:none;width:236px;background:var(--fill);color:var(--on-fill);flex-direction:column;padding:26px 0 20px}
  .brand{padding:0 24px 22px;border-bottom:1px solid rgba(255,255,255,.2)}
  .brand b{display:block;font:600 19px/1.05 var(--font-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;margin-top:8px;color:var(--on-fill-muted);font-size:13.5px}
  .side nav{display:flex;flex-direction:column;padding:14px 0;flex:1}
  .side nav button{display:flex;align-items:center;gap:12px;padding:13px 20px;font:500 15px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--on-fill-muted);border-left:4px solid transparent}
  .side nav button:hover{color:var(--on-fill)}
  .side nav button.on{color:var(--on-fill);background:rgba(255,255,255,.12);border-left-color:var(--on-fill)}
  .side nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;flex:none}
  .side nav em{margin-left:auto;background:var(--crit);color:#fff;font:500 12px/1 var(--font-display);font-style:normal;padding:3px 6px}
  .sidefoot{padding:16px 24px 0;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:11px;align-items:flex-start}
  .sidefoot small{color:var(--on-fill-muted);font-size:12.5px;line-height:1.35}
  .sidefoot button{color:var(--on-fill);font:500 13px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;text-decoration:underline;text-underline-offset:4px}
  .sidefoot button[disabled]{opacity:.5}
  .mainarea{flex:1;min-width:0;display:flex;background:var(--bg)}
  .split{display:flex;flex:1;min-width:0}
  .pane{flex:1;min-width:0;height:100%}
  .pl{flex:0 0 400px;border-right:1px solid var(--line)}
  .top{background:var(--bg);color:var(--head);border-bottom:5px solid var(--rule);padding-top:26px}
  .top .eyebrow{color:var(--muted)}
  .back{background:var(--bg);color:var(--head);padding-top:22px}
  .back + .top{padding-top:10px}
  .pd > .back[data-a="back"]{display:none}
  .pd > .back[data-a="back"] + .top{padding-top:26px}
  h1{font-size:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
  .back + .top h1,.navbar + .top h1{font-size:28px}
  .top .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h2{white-space:nowrap}
  .tile b{font-size:52px}
  .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"hear alerts" "hear dl";grid-template-rows:auto 1fr;column-gap:40px}
  .c-hear{grid-area:hear}.c-alerts{grid-area:alerts}.c-dl{grid-area:dl}
  .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b" "c b";grid-template-rows:auto 1fr;column-gap:40px}
  .k-a{grid-area:a}.k-b{grid-area:b}.k-c{grid-area:c}
  .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;align-items:start}
  .calwrap{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);column-gap:40px;align-items:start}
  .grid button{min-width:0;overflow:hidden;aspect-ratio:auto;min-height:108px;text-align:left;padding:6px 7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font:500 15px/1 var(--font-display)}
  .grid button:hover{background:var(--grey)}
  .grid button.sel:hover{background:var(--fill)}

  .grid button{font:500 14.5px/1 var(--font-display)}

/* ── кольори видів справ, більші картки, переходи ── */

body,.side,.field,.card,.box{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.btn,.side nav button,.sidefoot button,.filters button,.tabs button,.calhead button,.grid button,.row,.tb tbody tr,.hc,.nx,.wk div,.chk,.lnk,.navbar button{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease,opacity .15s ease}
.hc:hover,.nx:hover{border-color:var(--acc);transform:translateY(-1px)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#app.enter .scr > *{animation:rise .24s cubic-bezier(.2,.7,.2,1) both}

.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;background:var(--grey);border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin-top:16px;font-size:14.5px;color:var(--soft)}

#app.fold-in .fb{animation:rise .22s cubic-bezier(.2,.7,.2,1) both}
@media (min-width:960px){.mobonly{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<div class="app"><div id="app" style="display:contents"></div><div id="toast" role="status"></div></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T0=new Date();T0.setHours(0,0,0,0);
const we=d=>{const x=new Date(d);while(x.getDay()%6===0)x.setDate(x.getDate()+1);return x};
const plus=(d,n)=>we(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));
const left=d=>Math.round((d-T0)/864e5);
const MG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const WD=['нд','пн','вт','ср','чт','пт','сб'];
const p2=n=>String(n).padStart(2,'0');
const fd=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`;
const fh=d=>`${d.getDate()} ${MG[d.getMonth()]}, ${WD[d.getDay()]}`;
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const pd=v=>{const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)};
const TYPES={civ:'Цивільна',com:'Господарська',adm:'КУпАП',crim:'Кримінальна',admj:'Адміністративна',oth:'Інша'};

async function api(path,body){

  headers:Object.assign({'Authorization':'Bearer '+S.token},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&path!=='login'){logout();throw new Error('Потрібен вхід.')}

const typeOf=(f,num,desc,court,inv)=>{f=String(f||'').toLowerCase();if(/господар/.test(f))return 'com';if(/кримін/.test(f))return 'crim';if(/правопоруш|купап/.test(f))return 'adm';if(/адміністрат/.test(f))return 'admj';if(/цивіл/.test(f))return 'civ';
 const n=String(num||'').toLowerCase();if(/-ц$/.test(n))return 'civ';if(/-к$/.test(n))return 'crim';if(/-п$/.test(n))return 'adm';if(/-а$/.test(n))return 'admj';if(/^9\d\d\//.test(n))return 'com';

 if(/купап|адміністративн\S* правопоруш/.test(d))return 'adm';
 if(/господарськ/.test(c))return 'com';
 if(/адміністративн/.test(c))return 'admj';
 if(/обвинувач|підозрюван|потерпіл/.test(p)||/кримінальн|\bкк\b|вирок/.test(d))return 'crim';
 if(/сімейн|шлюб|алімент|спадщ|спадк|позик|борг|стягнення|власност|відшкодуван|договор|купівлі|виселен|усиновлен|батьківськ/.test(d))return 'civ';

 const add=(it,src)=>{if(!it||!it.number)return;const c=get(it.number);
  c.court=c.court||it.court||'';c.judge=c.judge||it.judge||'';c.parties=c.parties||it.involved||'';c.subj=c.subj||it.description||'';
  if(c.type==='oth')c.type=typeOf(it.forma,it.number,it.description,it.court,it.involved);
  const m=String(it.matched||'');if(m&&!m.startsWith('справа №'))c.client=m;
  if(src==='adv')c.role='я у справі';
  const d=/(\d{2})\.(\d{2})\.(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/.exec(it.date||'');

   const sure=src!=='cli'||m.startsWith('справа №');
   const ex=c.ev.find(e=>+e.d===+dt&&e.tm===tm);
   if(ex){ex.sure=ex.sure||sure}else c.ev.push({d:dt,tm,rm:it.courtroom?'зал/каб. '+it.courtroom:'',court:it.court||'',src,sure,raw:it})}};
 (o.advocate||[]).forEach(it=>add(it,'adv'));(o.clients||[]).forEach(it=>add(it,'cli'));(o.manual||[]).forEach(it=>add(it,'man'));
 (o.tracked||[]).forEach(n=>{get(n).tracked=true});

 const list=[...map.values()];
 list.forEach(c=>{c.ev.sort((a,b)=>a.d-b.d||a.tm.localeCompare(b.tm));if(c.type==='oth')c.type=typeOf('',c.num,c.subj,c.court,c.parties);

 C=list;W=o.names||[];TR=o.tracked||[];NC=o.newCases||[];S.updated=o.updated||'';S.calendar=!!o.calendar;

 <div class="fill">${(D.rows||[]).length?tbl([['Дата','17%'],['Документ','20%'],['Суть','41%'],['Суддя','22%']],D.rows.map(d=>{const pend=(d.findings||[]).filter((f,i)=>!(d.applied||[]).includes(i));return `<tr data-a="doc" data-v="${esc(d.id)}">${cell(d.date)}${cell(d.form,'b')}<td title="${esc((d.labels||[]).join(' · '))}">${esc((d.labels||[]).join(' · '))}${pend.length?` <span class="wr">${(d.labels||[]).length?'· ':''}є дані для внесення</span>`:''}${!(d.labels||[]).length&&!pend.length?'<span style="color:var(--muted)">відкрийте, щоб прочитати</span>':''}</td>${cell(sn(d.judge),'m')}</tr>`})):''}
 ${D.loading&&!(D.rows||[]).length?'<p class="empty">Шукаю в реєстрі судових рішень.</p>':''}
 ${D.err?`<p class="err">${esc(D.err)}</p><a class="btn ghost sm" href="https://reyestr.court.gov.ua/" target="_blank" rel="noopener">Відкрити пошук у реєстрі</a>`:''}
 ${D.rows&&!D.rows.length&&!D.loading&&!D.err?'<p class="empty">У реєстрі рішень у цій справі поки нічого немає.</p>':''}</div></div></div>`;
}
const ICON={today:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',cases:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',dl:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',mon:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'};
const TABS=[['today','Сьогодні'],['cases','Справи'],['cal','Календар'],['dl','Строки'],['mon','Моніторинг']];
const VIEWS={today:vToday,cases:vCases,cal:vCal,dl:vDl,mon:vMon};
const WVIEWS={today:wToday,cases:wCases,cal:vCal,dl:wDl,mon:vMon};
let lastKey='',lastSheet=null,lastMon=null;const SCROLL={};
function render(){
 const app=document.getElementById('app');
 if(!S.token){app.innerHTML=vLogin();return}
 if(!S.ready){app.innerHTML=!S.err?'<div class="login"><div class="row"><span class="spin"></span><span class="main"><small>Завантажую справи</small></span></div></div>':`<div class="login"><p class="err">${esc(S.err)}</p><button class="btn" data-a="reload">Спробувати ще раз</button><button class="btn ghost" data-a="logout">Вийти</button></div>`;return}
 const c=byKey(S.cid),wide=WIDE.matches,tab=c?'cases':S.tab,key=(wide?'w':'m')+tab+'|'+S.cid+'|'+S.doc;
 if(lastKey)SCROLL[lastKey]=[...app.querySelectorAll('.scr,.fill,.agenda,.cal')].map(el=>el.scrollTop);
 app.classList.toggle('enter',key!==lastKey);app.classList.toggle('sheet-in',!!S.sheet&&S.sheet!==lastSheet);lastSheet=S.sheet;app.classList.toggle('fold-in',key===lastKey&&lastMon!==null&&S.mon!==lastMon);lastMon=S.mon;lastKey=key;
 const badge={dl:dls().filter(x=>left(x.d.due)<=2).length,today:NC.length};
 if(wide){
  const v=c?(S.doc?vDoc(c,S.doc):wCase(c)):WVIEWS[tab]();
  app.innerHTML=`<aside class="side"><div class="brand"><b>Мої судові справи</b><small>Адвокат Осадько О.О.</small></div>
   <nav>${TABS.map(([k,t])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span>${t}</span>${badge[k]?`<em>${badge[k]}</em>`:''}</button>`).join('')}</nav>
   <div class="sidefoot"><small>${S.err?esc(S.err):'Бот оновив перелік '+esc(S.updated||'(час невідомий)')+(S.scan?'<br>'+esc(scanShort())+(cycleShort()?'<br>'+esc(cycleShort()):''):'')}</small><button data-a="reload"${S.busy?' disabled':''}>Оновити дані</button><button data-a="scan">Запустити прогін</button><button data-a="theme">${theme.eff()==='dark'?'Денна тема':'Нічна тема'}</button><button data-a="logout">Вийти</button></div></aside>
   <div class="mainarea"><section class="scr pane${tab==='mon'||(c&&S.doc)?' free':''}">${v}</section></div>${sheet()}`;
 }else{
  const v=c?(S.doc?vDoc(c,S.doc):vCase(c)):VIEWS[S.tab]();
  app.innerHTML=`<main class="scr">${v}</main><nav class="tabs">${TABS.map(([k,t])=>`<button class="${(S.tab===k&&!c)||(c&&k==='cases')?'on':''}" data-a="tab" data-v="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${t}${badge[k]?`<em>${badge[k]}</em>`:''}</button>`).join('')}</nav>${sheet()}`;
 }
 const pos=SCROLL[key]||[];app.querySelectorAll('.scr,.fill,.agenda,.cal').forEach((el,i)=>{el.scrollTop=pos[i]||0});
}
const WIDE=matchMedia('(min-width:960px)');
WIDE.addEventListener('change',()=>render());
function openCase(k){S.cid=k;S.doc=null;if(WIDE.matches)S.tab='cases';delete SCROLL[(WIDE.matches?'w':'m')+'cases|'+k+'|null'];render();const x=byKey(k);if(x)loadDocs(x,false)}
function flip(step){const L=navList(),i=L.findIndex(x=>x.key===S.cid),n=L[i+step];if(i>=0&&n)openCase(n.key)}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.sheet){S.sheet=null;S.preset=null;render();return}
 if(!WIDE.matches||S.sheet||!S.cid||/^(INPUT|SELECT|TEXTAREA)$/.test((e.target||{}).tagName||''))return;
 if(e.key==='Escape'){if(S.doc)S.doc=null;else S.cid=null;render()}
 else if(!S.doc&&e.key==='ArrowRight'){e.preventDefault();flip(1)}
 else if(!S.doc&&e.key==='ArrowLeft'){e.preventDefault();flip(-1)}
});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

// ── дії ──
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,c=byKey(S.cid);
 if(a==='close'){if(e.target!==b)return;S.sheet=null;S.preset=null}
 else if(a==='tab'){S.tab=v;S.cid=null;S.doc=null}
 else if(a==='open'){openCase(v);return}
 else if(a==='flip'){flip(+v);return}
 else if(a==='theme')theme.toggle();
 else if(a==='fold'){S.mon=S.mon===v?'':v;store.set('cc_mon',S.mon||'none')}
 else if(a==='gmode'){await act('groups',{id:b.dataset.g,mode:v},'Режим збережено. Діятиме з наступного прогону.');return}
 else if(a==='sort'){S.sort=S.sort.k===v?{k:v,d:-S.sort.d}:{k:v,d:1}}
 else if(a==='back'){S.cid=null;S.doc=null}
 else if(a==='docback')S.doc=null;
 else if(a==='doc'){S.doc=v;render();loadDoc(v,false);return}
 else if(a==='doctext'){loadDoc(S.doc,true);return}
 else if(a==='docs'){if(c)loadDocs(c,true);return}
 else if(a==='filter')S.filter=v;
 else if(a==='sheet')S.sheet=v;
 else if(a==='calnav'){S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()+ +v,1);S.calD=null}
 else if(a==='calday')S.calD=S.calD&&+S.calD===+v?null:new Date(+v);
 else if(a==='caltoday'){S.calM=new Date(T0.getFullYear(),T0.getMonth(),1);S.calD=null}
 else if(a==='calall')S.calD=null;
 else if(a==='reload'){load(false);return}
 else if(a==='logout'){api('logout',{}).catch(()=>{});logout();return}
 else if(a==='scan'){try{await api('scan',{});toast('Прогін запущено. Результат буде за кілька хвилин.')}catch(err){toast(err.message)}return}
 else if(a==='track'){await act('track',{add:v},'Справу поставлено на стеження');return}
 else if(a==='untrack'){await act('track',{remove:v},'Стеження припинено');return}
 else if(a==='ncdone'){await act('newcase',{dismiss:v});return}
 else if(a==='unname'){await act('names',{remove:v},'Клієнта прибрано');return}
 else if(a==='dldone'){const d=C.flatMap(x=>x.dl).find(x=>x.key===v);if(d)await act('deadline',{done:v,value:!d.done});return}
 else if(a==='dldel'){await act('deadline',{remove:v},'Строк видалено. Подію в календарі приберіть вручну.');return}
 else if(a==='gcal'){const ev=c&&c.ev[+v];if(ev){try{await api('gcal',{item:ev.raw});S.gcal[gid(ev.raw.number,ev.raw.date)]='queued';toast('Засідання поставлено в чергу календаря');render();setTimeout(()=>load(true),60000);setTimeout(()=>load(true),150000)}catch(err){toast(err.message)}}return}
 else if(a==='apply'){
  const row=((DOCS[c.key]||{}).rows||[]).find(d=>d.id===S.doc)||{},X=DOC[S.doc]||{},f=(X.findings||row.findings||[])[+v];if(!f)return;
  if(f.kind==='deadline'){S.preset={title:f.title,days:f.days,basis:`${(row.form||'документ').toLowerCase()} від ${row.date||''}`,doc:S.doc,idx:+v};S.sheet='dl'}
  else{const ok=await act('hearing',{number:c.num,date:f.date,time:f.time||'',court:row.court||c.court,judge:row.judge||'',forma:row.kind||'',note:`За документом суду: ${(row.form||'').toLowerCase()} від ${row.date||''}`,doc:S.doc,idx:+v},'Засідання додано');if(ok)loadDoc(S.doc,false);return}
 }
 else if(a==='copy'){const x=byKey(v),txt=`Справа № ${x.num}\n${x.court}\nСуддя: ${x.judge}`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('Реквізити скопійовано'),()=>toast('Не вдалося скопіювати'))}catch(_){toast('Не вдалося скопіювати')}return}
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;document.getElementById('caselist').innerHTML=caseList()}});
document.addEventListener('change',async e=>{const g=e.target&&e.target.dataset?e.target.dataset.g:'';if(!g)return;await act('groups',{id:g,mode:e.target.value},'Режим збережено. Діятиме з наступного прогону.')});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target.dataset.f,c=byKey(S.cid),val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 if(f==='login'){S.busy=true;S.err='';const pw=val('pw');render();
  try{const j=await api('login',{password:pw});S.token=j.token;store.set('cc_token',j.token);S.busy=false;await load(false)}catch(err){S.busy=false;S.err=err.message;S.token='';render()}return}
 if(f==='name'){await act('names',{add:val('newname')},'Клієнта додано');return}
 if(f==='track'){const ok=await act('track',{add:val('newnum')},'Справу поставлено на стеження');if(ok){S.sheet=null;render()}return}
 if(f==='dl'&&c){const list=(S.preset?[[S.preset.title,S.preset.days,S.preset.basis]]:[]).concat(TPL[c.type]||TPL.civ),t=list[+val('dltpl')]||list[0],from=pd(val('dlfrom')),due=plus(from,t[1]);
  const p=S.preset&&+val('dltpl')===0?S.preset:null;
  const ok=await act('deadline',{add:{number:c.num,date:fd(due),title:t[0],note:`${t[1]} дн. від ${fd(from)}, ${t[2]}`},doc:p?p.doc:undefined,idx:p?p.idx:undefined},'Строк до '+fd(due));
  if(ok){S.sheet=null;S.preset=null;render();if(p)loadDoc(p.doc,false)}return}
 if(f==='dlnew'){const ok=await act('deadline',{add:{number:val('dncase'),date:fd(pd(val('dndate'))),title:val('dntitle'),note:'дату вказано вручну'}},'Строк додано');if(ok){S.sheet=null;render()}return}
 if(f==='hear'&&c){const d=pd(val('hdate'));const ok=await act('hearing',{number:c.num,date:fd(d),time:val('htime'),court:c.court,judge:c.judge==='не визначено'?'':c.judge,courtroom:val('hroom'),note:'Додано вручну'},'Засідання додано');if(ok){S.sheet=null;render()}return}
});
if(S.token)load(false);else render();
</script>
