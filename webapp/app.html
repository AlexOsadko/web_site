<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мої справи">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5a4c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/icon.png">
<title>Мої судові справи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-column app, five tabs at the bottom, bottom sheets for input */
  --bg:#e9ecea; --surface:#ffffff; --surface2:#f3f5f3; --ink:#16211d; --muted:#5b6964; --line:#d9dedb;
  --accent:#1f5a4c; --accent-ink:#ffffff; --accent-soft:#deeee8;
  --crit:#b3261e; --crit-soft:#fbe8e6; --warn:#855600; --warn-soft:#fbefd2; --ok:#1e6a39; --ok-soft:#e1f1e6;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0d1311; --surface:#161d1a; --surface2:#1c2521; --ink:#e6ece9; --muted:#97a59f; --line:#2a3530;
    --accent:#62c4a8; --accent-ink:#0a1a15; --accent-soft:#17342c;
    --crit:#ff8d83; --crit-soft:#3b1b18; --warn:#f0c463; --warn-soft:#382c10; --ok:#80d59b; --ok-soft:#15301e;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;height:100%;margin:0 auto;background:var(--surface2);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-direction:column;gap:2px}
.eyebrow{margin:0;color:var(--muted);font-size:13px}
h1{font:500 22px/1.2 var(--font-display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 13px/1.2 var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.fresh{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fresh i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:5px}
.fresh.bad i{background:var(--crit)}
.fresh span{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:500 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);line-height:1.25}
.tile.hot b{color:var(--crit)}
.alert{background:var(--crit-soft);color:var(--crit);border-radius:14px;padding:10px 12px;font-size:13.5px;border-left:4px solid var(--crit)}
.alert b{display:block}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .main b{font-weight:600;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.row small.hl{color:var(--accent)}
.row small.wr{color:var(--warn)}
.date{flex:none;width:44px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 0;font-size:11.5px;line-height:1.1}
.date b{display:block;font:500 17px/1.1 var(--font-display)}
.num{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.chip{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.tag{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:10px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-1px)}
.done b{text-decoration:line-through;color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;font-weight:600;text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--crit);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto}
.back{color:var(--accent);font-weight:600;align-self:flex-start;padding:4px 0}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:0}
.meta div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.meta div:last-child{border:0}
.meta dt{flex:none;width:96px;color:var(--muted)}
.meta dd{margin:0;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.text{font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink)}
.inline{display:flex;gap:8px}
.inline .field{flex:1;min-width:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calhead b{font:500 15px var(--font-display)}
.calhead button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid span{font-size:11.5px;color:var(--muted);padding:4px 0}
.grid button{aspect-ratio:1;border-radius:10px;text-align:center;font-variant-numeric:tabular-nums;position:relative;font-size:14px}
.grid button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid button.sel{background:var(--accent);color:var(--accent-ink)}
.grid button i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.grid button i.d{background:var(--crit)}
.grid button i.both{box-shadow:7px 0 0 var(--crit);transform:translateX(-6px)}
.grid button.sel i{background:var(--accent-ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px}
.legend i.d{background:var(--crit)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 2px;margin:0}
.err{color:var(--crit);font-size:13.5px;margin:0}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:10.5px;color:var(--muted);position:relative}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs em{position:absolute;top:4px;left:calc(50% + 6px);background:var(--crit);color:#fff;border-radius:999px;font:600 10px/16px var(--font-body);min-width:16px;height:16px;padding:0 4px;text-align:center}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:90%;overflow-y:auto}
.sheet h3{margin:0;font:500 16px var(--font-display)}
.sheet label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sheet p{margin:0;font-size:12.5px;color:var(--muted)}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.login p{margin:0;color:var(--muted)}
#toast{position:absolute;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:13px;border-radius:999px;padding:7px 14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:9}
#toast.show{opacity:1}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div class="app"><div id="app" style="display:contents"></div><div id="toast" role="status"></div></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T0=new Date();T0.setHours(0,0,0,0);
const we=d=>{const x=new Date(d);while(x.getDay()%6===0)x.setDate(x.getDate()+1);return x};
const plus=(d,n)=>we(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));
const left=d=>Math.round((d-T0)/864e5);
const MG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const WD=['нд','пн','вт','ср','чт','пт','сб'];
const p2=n=>String(n).padStart(2,'0');
const fd=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`;
const fh=d=>`${d.getDate()} ${MG[d.getMonth()]}, ${WD[d.getDay()]}`;
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const pd=v=>{const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)};
const TYPES={civ:'Цивільна',com:'Господарська',adm:'КУпАП',crim:'Кримінальна',admj:'Адміністративна',oth:'Інша'};
const TPL={
 civ:[['Відзив на позов',15,'ст. 178 ЦПК, не менше 15 днів з вручення ухвали'],['Апеляційна скарга на рішення',30,'ст. 354 ЦПК'],['Апеляційна скарга на ухвалу',15,'ст. 354 ЦПК'],['Касаційна скарга',30,'ст. 390 ЦПК']],
 com:[['Відзив на позов',15,'ст. 165 ГПК, не менше 15 днів з вручення ухвали'],['Апеляційна скарга на рішення',20,'ст. 256 ГПК'],['Апеляційна скарга на ухвалу',10,'ст. 256 ГПК'],['Касаційна скарга',20,'ст. 288 ГПК']],
 adm:[['Апеляційна скарга на постанову',10,'ст. 294 КУпАП']],
 crim:[['Апеляційна скарга на вирок',30,'ст. 395 КПК'],['Апеляційна скарга на ухвалу слідчого судді',5,'ст. 395 КПК']],
 admj:[['Відзив на позов',15,'ст. 162 КАС, строк встановлює суд'],['Апеляційна скарга на рішення',30,'ст. 295 КАС'],['Апеляційна скарга на ухвалу',15,'ст. 295 КАС'],['Касаційна скарга',30,'ст. 329 КАС']]
};
const store={get(k){try{return localStorage.getItem(k)||''}catch(_){return ''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(_){}}};
const S={token:store.get('cc_token'),ready:false,busy:false,err:'',updated:'',calendar:false,tab:'today',cid:null,doc:null,filter:'all',q:'',sheet:null,preset:null,
 calM:new Date(T0.getFullYear(),T0.getMonth(),1),calD:T0};
let C=[],W=[],TR=[],NC=[];const DOCS={},DOC={};

// ── сервер ──
async function api(path,body){
 const r=await fetch('/api/'+path,{method:body?'POST':'GET',cache:'no-store',
  headers:Object.assign({'Authorization':'Bearer '+S.token},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&path!=='login'){logout();throw new Error('Потрібен вхід.')}
 if(!r.ok)throw new Error(j.error||('Помилка сервера ('+r.status+')'));
 return j;
}
function logout(){S.token='';store.set('cc_token','');S.ready=false;render()}
const caseKey=n=>{const b=String(n||'').replace(/[‐-―−]/g,'-').toLowerCase().replace(/\s+/g,'').replace(/^№+/,'').replace(/-[^\d/]+$/,'');const m=b.match(/(\d{2,4})\/(\d{1,7})\/(\d{2})(?!\d)/);return m?`${m[1]}/${+m[2]}/${m[3]}`:b};
const typeOf=(f,num)=>{f=String(f||'').toLowerCase();if(/господар/.test(f))return 'com';if(/кримін/.test(f))return 'crim';if(/правопоруш|купап/.test(f))return 'adm';if(/адміністрат/.test(f))return 'admj';if(/цивіл/.test(f))return 'civ';
 const n=String(num||'').toLowerCase();if(/-ц$/.test(n))return 'civ';if(/-к$/.test(n))return 'crim';if(/-п$/.test(n))return 'adm';if(/-а$/.test(n))return 'admj';if(/^9\d\d\//.test(n))return 'com';return 'oth'};
function build(o){
 const map=new Map();
 const get=num=>{const k=caseKey(num);if(!map.has(k))map.set(k,{key:k,num:String(num),type:'oth',subj:'',parties:'',client:'',role:'',court:'',judge:'',ev:[],dl:[],tracked:false});return map.get(k)};
 const add=(it,src)=>{if(!it||!it.number)return;const c=get(it.number);
  c.court=c.court||it.court||'';c.judge=c.judge||it.judge||'';c.parties=c.parties||it.involved||'';c.subj=c.subj||it.description||'';
  if(c.type==='oth')c.type=typeOf(it.forma,it.number);
  const m=String(it.matched||'');if(m&&!m.startsWith('справа №'))c.client=m;
  if(src==='adv')c.role='ваша справа';
  const d=/(\d{2})\.(\d{2})\.(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/.exec(it.date||'');
  if(d){const dt=new Date(+d[3],+d[2]-1,+d[1]),tm=d[4]?p2(+d[4])+':'+d[5]:'';
   const sure=src!=='cli'||m.startsWith('справа №');
   const ex=c.ev.find(e=>+e.d===+dt&&e.tm===tm);
   if(ex){ex.sure=ex.sure||sure}else c.ev.push({d:dt,tm,rm:it.courtroom?'зал/каб. '+it.courtroom:'',court:it.court||'',src,sure,raw:it})}};
 (o.advocate||[]).forEach(it=>add(it,'adv'));(o.clients||[]).forEach(it=>add(it,'cli'));(o.manual||[]).forEach(it=>add(it,'man'));
 (o.tracked||[]).forEach(n=>{get(n).tracked=true});
 (o.deadlines||[]).forEach(x=>{const d=/(\d{2})\.(\d{2})\.(\d{4})/.exec(x.date||'');if(!d||!x.number)return;get(x.number).dl.push({key:x.key,t:x.title||'Строк',due:new Date(+d[3],+d[2]-1,+d[1]),b:x.note||'',done:!!x.done})});
 const list=[...map.values()];
 list.forEach(c=>{c.ev.sort((a,b)=>a.d-b.d||a.tm.localeCompare(b.tm));if(c.type==='oth')c.type=typeOf('',c.num);
  if(!c.client)c.client=c.parties?c.parties.slice(0,70):'Справа № '+c.num;if(!c.court)c.court='Суд не визначено';if(!c.judge)c.judge='не визначено'});
 list.sort((a,b)=>((a.ev[0]||{}).d||9e15)-((b.ev[0]||{}).d||9e15));
 C=list;W=o.names||[];TR=o.tracked||[];NC=o.newCases||[];S.updated=o.updated||'';S.calendar=!!o.calendar;
}
async function load(quiet){
 if(!quiet){S.busy=true;render()}
 try{build(await api('state'));S.err='';S.ready=true}catch(e){S.err=e.message}
 S.busy=false;render();
}
async function act(path,body,okMsg){
 try{await api(path,body);if(okMsg)toast(okMsg);await load(true);return true}catch(e){toast(e.message);return false}
}
async function loadDocs(c,force){
 const k=c.key,cur=DOCS[k]||{};
 if(cur.loading||(cur.rows&&!force))return;
 DOCS[k]={loading:true,rows:cur.rows};render();
 try{const j=await api('docs?case='+encodeURIComponent(c.num)+(force?'&force=1':''));DOCS[k]={rows:j.rows||[],checked:j.checked}}
 catch(e){DOCS[k]={err:e.message,rows:cur.rows||[]}}
 render();
}
async function loadDoc(id,text){
 const cur=DOC[id]||{};if(cur.loading)return;
 DOC[id]=Object.assign({},cur,{loading:true});render();
 try{const j=await api('doc?id='+encodeURIComponent(id)+(text?'&text=1':''));DOC[id]=Object.assign({},cur,j,{loading:false,err:''})}
 catch(e){DOC[id]=Object.assign({},cur,{loading:false,err:e.message})}
 render();
}

// ── похідні списки ──
const byKey=k=>C.find(c=>c.key===k);
const hearings=()=>C.flatMap(c=>c.ev.filter(e=>left(e.d)>=0).map(e=>({c,e}))).sort((a,b)=>a.e.d-b.e.d||a.e.tm.localeCompare(b.e.tm));
const dls=()=>C.flatMap(c=>c.dl.filter(d=>!d.done).map(d=>({c,d}))).sort((a,b)=>a.d.due-b.d.due);
const mins=t=>{const[h,m]=String(t||'0:0').split(':');return h*60+ +m};
function conflicts(hs){const r=[];for(let i=0;i<hs.length;i++)for(let j=i+1;j<hs.length;j++){const a=hs[i],b=hs[j];if(a.e.tm&&b.e.tm&&+a.e.d===+b.e.d&&a.e.court!==b.e.court&&a.c.key!==b.c.key&&Math.abs(mins(a.e.tm)-mins(b.e.tm))<120)r.push([a,b])}return r}
function chip(n){const c=n<=2?'crit':n<=7?'warn':'ok';const t=n<0?`прострочено ${-n} дн.`:n===0?'сьогодні':n===1?'завтра':`${n} дн.`;return `<span class="chip ${c}">${t}</span>`}
const dateBox=d=>`<span class="date"><b>${d.getDate()}</b>${MS[d.getMonth()]}</span>`;
const hRow=({c,e},link=true)=>`<${link?'button data-a="open" data-v="'+esc(c.key)+'"':'div'} class="row">${dateBox(e.d)}<span class="main"><b>${e.tm?e.tm+' · ':''}${esc(c.client)}</b><small><span class="num">${esc(c.num)}</span></small><small>${esc(e.court||c.court)}${e.rm?', '+esc(e.rm):''}</small>${e.sure?'':'<small class="wr">Збіг лише за ПІБ – перевірте</small>'}</span>${chip(left(e.d))}</${link?'button':'div'}>`;

 else if(a==='tab'){S.tab=v;S.cid=null;S.doc=null}
 else if(a==='open'){S.cid=v;S.doc=null;const x=byKey(v);if(x)loadDocs(x,false);return}
 else if(a==='back'){S.cid=null;S.doc=null}
 else if(a==='docback')S.doc=null;
 else if(a==='doc'){S.doc=v;render();loadDoc(v,false);return}
 else if(a==='doctext'){loadDoc(S.doc,true);return}
 else if(a==='docs'){if(c)loadDocs(c,true);return}
 else if(a==='filter')S.filter=v;
 else if(a==='sheet')S.sheet=v;
 else if(a==='calnav')S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()+ +v,1);
 else if(a==='calday')S.calD=new Date(+v);
 else if(a==='reload'){load(false);return}
 else if(a==='logout'){api('logout',{}).catch(()=>{});logout();return}
 else if(a==='scan'){try{await api('scan',{});toast('Прогін запущено. Результат буде за кілька хвилин.')}catch(err){toast(err.message)}return}
 else if(a==='track'){await act('track',{add:v},'Справу поставлено на стеження');return}
 else if(a==='untrack'){await act('track',{remove:v},'Стеження припинено');return}
 else if(a==='ncdone'){await act('newcase',{dismiss:v});return}
 else if(a==='unname'){await act('names',{remove:v},'Клієнта прибрано');return}
 else if(a==='dldone'){const d=C.flatMap(x=>x.dl).find(x=>x.key===v);if(d)await act('deadline',{done:v,value:!d.done});return}
 else if(a==='dldel'){await act('deadline',{remove:v},'Строк видалено. Подію в календарі приберіть вручну.');return}
 else if(a==='gcal'){const ev=c&&c.ev[+v];if(ev){try{await api('gcal',{item:ev.raw});toast('Засідання поставлено в чергу календаря')}catch(err){toast(err.message)}}return}
 else if(a==='apply'){
  const row=((DOCS[c.key]||{}).rows||[]).find(d=>d.id===S.doc)||{},X=DOC[S.doc]||{},f=(X.findings||row.findings||[])[+v];if(!f)return;
  if(f.kind==='deadline'){S.preset={title:f.title,days:f.days,basis:`${(row.form||'документ').toLowerCase()} від ${row.date||''}`,doc:S.doc,idx:+v};S.sheet='dl'}
  else{const ok=await act('hearing',{number:c.num,date:f.date,time:f.time||'',court:row.court||c.court,judge:row.judge||'',forma:row.kind||'',note:`За документом суду: ${(row.form||'').toLowerCase()} від ${row.date||''}`,doc:S.doc,idx:+v},'Засідання додано');if(ok)loadDoc(S.doc,false);return}
 }
 else if(a==='copy'){const x=byKey(v),txt=`Справа № ${x.num}\n${x.court}\nСуддя: ${x.judge}`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('Реквізити скопійовано'),()=>toast('Не вдалося скопіювати'))}catch(_){toast('Не вдалося скопіювати')}return}
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;document.getElementById('caselist').innerHTML=caseList()}});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target.dataset.f,c=byKey(S.cid),val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 if(f==='login'){S.busy=true;S.err='';const pw=val('pw');render();
  try{const j=await api('login',{password:pw});S.token=j.token;store.set('cc_token',j.token);S.busy=false;await load(false)}catch(err){S.busy=false;S.err=err.message;S.token='';render()}return}
 if(f==='name'){await act('names',{add:val('newname')},'Клієнта додано');return}
 if(f==='track'){const ok=await act('track',{add:val('newnum')},'Справу поставлено на стеження');if(ok){S.sheet=null;render()}return}
 if(f==='dl'&&c){const list=(S.preset?[[S.preset.title,S.preset.days,S.preset.basis]]:[]).concat(TPL[c.type]||TPL.civ),t=list[+val('dltpl')]||list[0],from=pd(val('dlfrom')),due=plus(from,t[1]);
  const p=S.preset&&+val('dltpl')===0?S.preset:null;
  const ok=await act('deadline',{add:{number:c.num,date:fd(due),title:t[0],note:`${t[1]} дн. від ${fd(from)}, ${t[2]}`},doc:p?p.doc:undefined,idx:p?p.idx:undefined},'Строк до '+fd(due));
  if(ok){S.sheet=null;S.preset=null;render();if(p)loadDoc(p.doc,false)}return}
 if(f==='hear'&&c){const d=pd(val('hdate'));const ok=await act('hearing',{number:c.num,date:fd(d),time:val('htime'),court:c.court,judge:c.judge==='не визначено'?'':c.judge,courtroom:val('hroom'),note:'Додано вручну'},'Засідання додано');if(ok){S.sheet=null;render()}return}
});
if(S.token)load(false);else render();
</script>
</body>
</html>
