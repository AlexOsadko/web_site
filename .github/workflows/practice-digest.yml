name: Практика судів — щоденна добірка

# Раз на день: нові офіційні публікації ВС, Пленуму ВС і КСУ → AI відбирає
# 1–3 найкорисніші для практики → розбір у ПРИВАТНИЙ канал адвоката.
# Якщо нічого вартого немає — нічого не надсилається.
# Стан (уже розглянуті матеріали) — у .practice-bot/state.json.

on:
  schedule:
    # 05:12 UTC ≈ 08:12 за Києвом улітку (07:12 узимку)
    - cron: "12 5 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Лише показати нові матеріали (без AI, без надсилання, стан не змінюється)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: practice-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановити залежності
        run: pip install -r tools/requirements-bot.txt
      - name: Добірка практики
        env:
          # окремий бот практики (не бот сповіщень про засідання)
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRACTICE_BOT_TOKEN }}
          PRACTICE_CHAT: ${{ secrets.PRACTICE_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRACTICE_MAX: "3"
          PRACTICE_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: python3 tools/practice_digest.py

      - name: Зберегти стан
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          if [ -z "$(git status --porcelain .practice-bot)" ]; then
            echo "Стан не змінився — коміт не потрібен."
            exit 0
          fi
          git config user.name "osadko-practice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pb-state && cp -r .practice-bot /tmp/pb-state
          # Інші боти теж пушать у main — беремо свіжий main і кладемо лише наш стан.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -f -B _state origin/main
            rm -rf .practice-bot && cp -r /tmp/pb-state .practice-bot
            git add .practice-bot
            git commit -q -m "chore(practice-bot): update state [skip ci]" || { echo "нема змін"; exit 0; }
            if git push -q origin _state:main; then echo "стан збережено"; exit 0; fi
            echo "push відхилено — повтор ($i)…"; sleep 3
          done
          echo "Не вдалося зберегти стан після кількох спроб (не критично)."
