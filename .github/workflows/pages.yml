name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Деплой після завершення генератора статей (його бот-коміт сам по собі
  # не тригерить push-подію через анти-рекурсію GitHub, тому ловимо workflow_run).
  workflow_run:
    workflows: ["Створити статтю (AI)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Збирання і публікація рознесені у два завдання: коли обидва кроки йшли в
  # одному завданні, публікація шукала архів сайту за секунду після завантаження
  # і не знаходила його («No artifacts named github-pages»).
  build:
    # Для workflow_run збираємо лише при успішній генерації; для інших подій завжди.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # завжди беремо найсвіжіший main (із щойно створеною статтею)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # На сайт потрапляють лише сторінки: внутрішні нотатки, код ботів і їхній
      # стан лишаються тільки в репозиторії.
      - name: Прибрати службові папки з публікації
        run: rm -rf notes tools worker README.md .court-bot .practice-bot webapp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
