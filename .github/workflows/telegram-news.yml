name: Новини в Telegram

# Публікує новини (загальні + юридичні) у Telegram-канал і обробляє натискання
# кнопок [✅ Опублікувати] / [🗑 Відхилити] під чернетками авторських постів.
# Розклад — кожні 5 хв у денний час (щоб кнопки спрацьовували швидко), але
# САМ КОНТЕНТ виходить не частіше BOT_CONTENT_INTERVAL_MIN (типово 120 хв) →
# ~4–6 якісних постів «про право» на день. Загальні стрічки фільтруються за
# правовою релевантністю. Стан зберігається у .telegram-bot/state.json і
# комітиться ботом (через GITHUB_TOKEN, з [skip ci] — деплой не перезапускає).

on:
  schedule:
    # ⏳ РЕЖИМ НАПОВНЕННЯ (тимчасово): кожні 10 хв ЦІЛОДОБОВО — щоб наповнити
    # канал новинами за ~12 год (вдень і вночі). Темп обмежує BOT_FILL_* до
    # BOT_FILL_UNTIL; після цього часу бот сам повертається до звичайного темпу.
    # Після вікна повернути назад:  - cron: "*/5 6-18 * * *"  (кожні 5 хв, день).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тест без публікації (лише лог, стан не зберігається)"
        type: boolean
        default: false
      force_original:
        description: "Згенерувати авторську чернетку зараз (у чат перевірки з кнопками)"
        type: boolean
        default: false
      force_news:
        description: "Опублікувати новину в канал зараз (обходить інтервал 2 год)"
        type: boolean
        default: false
      force_count:
        description: "Скільки чернеток згенерувати (лише з force_original)"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install -r tools/requirements-bot.txt

      - name: Опублікувати новини
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # AI-резюме + оригінальні пости
          # Куди слати оригінальні пости на ПЕРЕВІРКУ (ваш Telegram id від
          # @userinfobot; напишіть боту /start). Порожньо + autopost=0 → оригінали
          # не публікуються. Щоб слати одразу в канал — BOT_ORIGINAL_AUTOPOST: "1".
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          # Миттєві кнопки через Cloudflare Worker (вебхук). Якщо задано —
          # чернетки реєструються у воркері, а бот не опитує getUpdates.
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_SECRET: ${{ secrets.BOT_WORKER_SECRET }}
          BOT_ORIGINAL_EVERY: "10"     # кожен 10-й ОПУБЛІКОВАНИЙ пост — авторський (~3–4/тиждень)
          BOT_ORIGINAL_AUTOPOST: ""    # "1" = публікувати оригінали в канал без перевірки
          BOT_MAX_PER_RUN: "1"         # 1 пост за запуск
          BOT_CONTENT_INTERVAL_MIN: "120"  # звичайний інтервал (після наповнення)
          BOT_DAILY_MAX: "12"          # звичайний добовий ліміт (після наповнення)
          # ⏳ Режим наповнення: до BOT_FILL_UNTIL (epoch) — частіше й більше.
          # 1787142075 = 2026-08-19 12:21 UTC (≈12 год від запуску). Після цього
          # часу бот сам повертається до звичайних інтервалу/ліміту вище.
          BOT_FILL_UNTIL: "1787142075"
          BOT_FILL_INTERVAL_MIN: "10"  # у режимі наповнення — новина кожні ~10 хв
          BOT_FILL_DAILY_MAX: "80"     # у режимі наповнення — до 80 постів/добу
          BOT_MAX_AGE_HOURS: "168"     # ширше вікно свіжості — більше матеріалу для наповнення
          BOT_FILTER_GENERAL: "1"      # загальні стрічки — лише правово релевантні новини
          BOT_CTA_EVERY: "6"           # кнопку «до адвоката» показувати кожен 6-й пост
          BOT_SHOW_PREVIEW: "1"        # показувати прев'ю статті (візуальне зображення джерела)
          # Кнопка «Написати адвокату» під постом. Змініть на свій Telegram
          # (напр. https://t.me/your_username) чи Viber/WhatsApp за бажанням.
          BOT_CONTACT_URL: "https://osadko.online/kontakty/"
          BOT_CONTACT_LABEL: "⚖️ Консультація адвоката"
          BOT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          BOT_FORCE_ORIGINAL: ${{ github.event.inputs.force_original == 'true' && '1' || '' }}
          BOT_FORCE_ORIGINAL_COUNT: ${{ github.event.inputs.force_count || '1' }}
          BOT_FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: python3 tools/telegram_news_bot.py

      - name: Зберегти стан
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain .telegram-bot)" ]; then
            git config user.name "osadko-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .telegram-bot
            git commit -m "chore(news-bot): update state [skip ci]"
            git push
          else
            echo "Стан не змінився — коміт не потрібен."
          fi
