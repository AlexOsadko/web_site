name: Новини в Telegram

# Публікує новини (загальні + юридичні) у Telegram-канал.
# Розклад — щогодини (UTC); за замовчуванням не більше 1 поста за запуск і
# не більше 15 постів на добу (керується BOT_MAX_PER_RUN / BOT_DAILY_MAX).
# Стан (уже опубліковані посилання) зберігається у .telegram-bot/state.json
# і комітиться назад ботом. Такий коміт (через GITHUB_TOKEN) НЕ перезапускає
# деплой сайту завдяки анти-рекурсії GitHub.

on:
  schedule:
    # Будні о 09:00 UTC (≈12:00 Київ). Через чергування (BOT_ORIGINAL_EVERY=2)
    # ≈ пів запусків — оригінальні пости (на перевірку), пів — новини в канал.
    # Орієнтир на місяць: ~10 оригінальних + ~10–15 новин. Тюнінг — тут і в env.
    - cron: "0 9 * * 1,2,3,4,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тест без публікації (лише лог, стан не зберігається)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install -r tools/requirements-bot.txt

      - name: Опублікувати новини
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # AI-резюме + оригінальні пости
          # Куди слати оригінальні пости на ПЕРЕВІРКУ (ваш Telegram id від
          # @userinfobot; напишіть боту /start). Порожньо + autopost=0 → оригінали
          # не публікуються. Щоб слати одразу в канал — BOT_ORIGINAL_AUTOPOST: "1".
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          BOT_ORIGINAL_EVERY: "2"      # кожен 2-й вихід — оригінальний пост
          BOT_ORIGINAL_AUTOPOST: ""    # "1" = публікувати оригінали в канал без перевірки
          BOT_MAX_PER_RUN: "1"
          BOT_DAILY_MAX: "2"           # запобіжник (звичайно 1 пост за запуск)
          BOT_MAX_AGE_HOURS: "120"     # свіжість під рідший темп (нд/пн/ср/пт)
          BOT_CTA_EVERY: "4"           # кнопку «до адвоката» показувати кожен 4-й пост
          BOT_SHOW_PREVIEW: "0"
          # Кнопка «Написати адвокату» під постом. Змініть на свій Telegram
          # (напр. https://t.me/your_username) чи Viber/WhatsApp за бажанням.
          BOT_CONTACT_URL: "https://osadko.online/kontakty/"
          BOT_CONTACT_LABEL: "⚖️ Консультація адвоката"
          BOT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 tools/telegram_news_bot.py

      - name: Зберегти стан
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain .telegram-bot)" ]; then
            git config user.name "osadko-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .telegram-bot
            git commit -m "chore(news-bot): update state [skip ci]"
            git push
          else
            echo "Стан не змінився — коміт не потрібен."
          fi
