name: Пробник суду (Список справ)

# Одноразовий огляд структури сторінки «Список справ, призначених до розгляду»
# суду — щоб написати парсер бота відстеження справ. Нічого не публікує.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL «Список справ призначених до розгляду» суду"
        type: string
        default: "https://sh.ki.court.gov.ua/sud2610/gromadyanam/csz"
      court_id:
        description: "Код суду для POST /new.php (напр. 2610). Порожньо = GET сторінки"
        type: string
        default: ""
      court_ids:
        description: "Кілька кодів судів через кому — сканувати /new.php (напр. 2601,2603,2606)"
        type: string
        default: ""
      sess:
        description: "Сесійний режим: GET сторінки CSZ + POST /new.php з cookie (URL = сторінка CSZ)"
        type: boolean
        default: false
      auto:
        description: "AUTO: перевірити fetch_auto() /post_test2.php (URL = сторінка list_auto_cases)"
        type: boolean
        default: false
      harvest:
        description: "HARVEST: зібрати хости судів (court.gov.ua) зі сторінки-каталогу"
        type: boolean
        default: false
      codes:
        description: "CODES: коди судів через кому (напр. 2601,2606,2610) — перевірка court.gov.ua/sudNNNN"
        type: string
        default: ""
      range:
        description: "RANGE: діапазон кодів для швидкого збору назв судів (напр. 1000-1999)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пробити сторінку
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
          COURT_ID: ${{ github.event.inputs.court_id }}
          COURT_IDS: ${{ github.event.inputs.court_ids }}
          SESS: ${{ github.event.inputs.sess == 'true' && '1' || '' }}
          AUTO: ${{ github.event.inputs.auto == 'true' && '1' || '' }}
          HARVEST: ${{ github.event.inputs.harvest == 'true' && '1' || '' }}
          CODES: ${{ github.event.inputs.codes }}
          RANGE: ${{ github.event.inputs.range }}
        run: python3 tools/court_probe.py
      - name: Зберегти зібрані суди
        if: ${{ github.event.inputs.range != '' }}
        run: |
          if [ -z "$(git status --porcelain tools/_courts_harvest)" ]; then
            echo "нема нових файлів"; exit 0
          fi
          git config user.name "osadko-court-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/harv && cp tools/_courts_harvest/*.txt /tmp/harv/ 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git checkout -q -B _h origin/main
            mkdir -p tools/_courts_harvest
            cp /tmp/harv/*.txt tools/_courts_harvest/ 2>/dev/null || true
            git add tools/_courts_harvest
            git commit -q -m "chore(court-probe): harvest [skip ci]" || { echo "нема змін"; exit 0; }
            if git push -q origin _h:main; then echo "збережено"; exit 0; fi
            echo "повтор $i"; sleep 3
          done
