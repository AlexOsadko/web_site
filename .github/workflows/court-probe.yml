name: Пробник суду (Список справ)

# Одноразовий огляд структури сторінки «Список справ, призначених до розгляду»
# суду — щоб написати парсер бота відстеження справ. Нічого не публікує.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL «Список справ призначених до розгляду» суду"
        type: string
        default: "https://sh.ki.court.gov.ua/sud2610/gromadyanam/csz"
      court_id:
        description: "Код суду для POST /new.php (напр. 2610). Порожньо = GET сторінки"
        type: string
        default: ""
      court_ids:
        description: "Кілька кодів судів через кому — сканувати /new.php (напр. 2601,2603,2606)"
        type: string
        default: ""
      sess:
        description: "Сесійний режим: GET сторінки CSZ + POST /new.php з cookie (URL = сторінка CSZ)"
        type: boolean
        default: false
      auto:
        description: "AUTO: перевірити fetch_auto() /post_test2.php (URL = сторінка list_auto_cases)"
        type: boolean
        default: false
      harvest:
        description: "HARVEST: зібрати хости судів (court.gov.ua) зі сторінки-каталогу"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пробити сторінку
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
          COURT_ID: ${{ github.event.inputs.court_id }}
          COURT_IDS: ${{ github.event.inputs.court_ids }}
          SESS: ${{ github.event.inputs.sess == 'true' && '1' || '' }}
          AUTO: ${{ github.event.inputs.auto == 'true' && '1' || '' }}
          HARVEST: ${{ github.event.inputs.harvest == 'true' && '1' || '' }}
        run: python3 tools/court_probe.py
