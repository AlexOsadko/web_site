name: Діагностика суду (чому не показав засідання)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Код суду (напр. 1015)"
        type: string
        default: "1015"
      date:
        description: "Дата засідання (ДД.ММ.РРРР)"
        type: string
        default: "17.09.2026"
      surname:
        description: "Прізвище для пошуку"
        type: string
        default: "Осадько"
      clients:
        description: "Звірити зі списком клієнтів бота (у лог лише ініціали)"
        type: boolean
        default: false
      edrsr:
        description: "Проба пошуку в ЄДРСР (запит); якщо задано — лише вона"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проба ЄДРСР
        if: ${{ github.event.inputs.edrsr != '' }}
        env:
          Q: ${{ github.event.inputs.edrsr }}
          EDRSR_VARIANTS: "1"
        run: python3 tools/edrsr.py "$Q"
      - name: Діагностика
        if: ${{ github.event.inputs.edrsr == '' }}
        env:
          DIAG_CODE: ${{ github.event.inputs.code }}
          DIAG_DATE: ${{ github.event.inputs.date }}
          DIAG_SURNAME: ${{ github.event.inputs.surname }}
          DIAG_CLIENTS: ${{ github.event.inputs.clients }}
          COURT_WATCH: ${{ secrets.COURT_WATCH }}
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_SECRET: ${{ secrets.BOT_WORKER_SECRET }}
          COURT_FETCH_TIMEOUT: "12"
          COURT_FETCH_TRIES: "3"
        run: python3 tools/court_diag.py
