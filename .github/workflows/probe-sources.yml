name: Пробник джерел (Пленум/КСУ)

# Розвідка джерел: постанови Пленуму ВС і рішення КСУ — доступність і структура.
# Нічого не публікує, лише звіт у лог.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Перевірити джерела
        run: python3 tools/probe_sources.py
